name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23' # Use a recent Go version

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libgl1-mesa-dev xorg-dev
        sudo apt-get install -y libusb-1.0-0-dev

    - name: Download Go Dependencies
      run: go mod download

    - name: Build Fynescope Simulator (noscope + web)
      run: |
        go build -tags="noscope,web" -ldflags="-X main.GitUUID=${GITHUB_SHA::7} -X main.BuildDate=$(date +%Y-%m-%d)" -o fynescope-sim-linux-amd64 .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          fynescope-sim-linux-amd64
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
